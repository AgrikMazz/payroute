server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: payroute
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payroute}
    username: ${SPRING_DATASOURCE_USERNAME:payroute}
    password: ${SPRING_DATASOURCE_PASSWORD:local-payroute-db}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: PayRoute
    description: Sandbox payment orchestration and reconciliation
    version: 1.0.0
payroute:
  security:
    api-key: ${PAYROUTE_API_KEY:local-demo-key}
    webhook-secret: ${PAYROUTE_WEBHOOK_SECRET:local-webhook-secret-change-me}
  routing:
    max-attempts: 2
    cost-weight: 0.45
    reliability-weight: 0.35
    latency-weight: 0.15
    preference-weight: 0.05
  webhooks:
    delivery-mode: ${PAYROUTE_WEBHOOK_DELIVERY_MODE:flaky-once}
    max-attempts: 5
    retry-base-seconds: ${PAYROUTE_RETRY_BASE_SECONDS:2}
    dispatcher-enabled: true
    poll-interval-ms: 1000
