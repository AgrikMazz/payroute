spring:
  datasource:
    url: jdbc:h2:mem:payroute-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 50ms
      repositories:
        enabled: false
payroute:
  webhooks:
    dispatcher-enabled: false
